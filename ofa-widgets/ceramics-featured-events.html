<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ceramics — Featured Events</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="LiveWhale calendar widget 45 (Featured Events) for ofa.fas.harvard.edu/ceramics. Intended to be viewed inside an iframe.">

<!-- Same Google Fonts request ofa.fas.harvard.edu makes, so the widget body
     copy renders in the host page's typeface rather than a fallback. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<!-- Links must open in a new tab: the host iframe is sandboxed without allow-top-navigation. -->
<base target="_blank">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;   /* let the host page's background show through */
  }
  body {
    /* The widget CSS sets font-family:inherit on event copy, so this is what
       the text picks up. Matches ofa.fas.harvard.edu's body font. Event titles
       are hard-coded to Georgia by LiveWhale and match automatically. */
    font-family: "Source Sans Pro", Arial, Helvetica, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: #202020;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  #widget { padding: 0; }
  /* Placeholder while the widget's XHR is in flight */
  .lwcw.loading::before {
    content: "Loading events\2026";
    display: block;
    padding: 4px 0;
    font-size: 14px;
    color: #6b6b6b;
  }
  /* Keep long event titles/URLs from forcing a horizontal scrollbar */
  #widget a, #widget p, #widget h3 { overflow-wrap: break-word; word-wrap: break-word; }

  /* --- Column count -------------------------------------------------------
     LiveWhale ships repeat(auto-fill, minmax(300px, 1fr)), so the grid drops
     to 3 or 2 columns on any host page narrow enough -- which is every page
     with a sidebar. We want 4 columns on full-width and sidebar pages alike.

     This frame's viewport IS the host page's embed column, so a plain media
     query reads the host's layout directly. #widget out-specifies LiveWhale's
     ul.harvard-widget, so these win regardless of injection order.
     ------------------------------------------------------------------------ */
  #widget ul.harvard-widget {
    /* minmax(0, 1fr), not 1fr: a bare 1fr track floors at the item's
       min-content width, which the event photo pins at its intrinsic 445px.
       That makes the grid overflow its container instead of shrinking. */
    grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
  }
  #widget li.widget-event { min-width: 0 !important; }

  /* LiveWhale's own image rules target div.widget-photo-space > span > a > img,
     but it renders the photo two levels deeper than that
     (span.widget-photo > a > span.lw_item_thumb > a > picture > img), so the
     rule never matches and the image never scales down. These selectors match
     what LiveWhale actually emits, using the same 4:3 box and object-fit the
     per-widget stylesheets were reaching for. */
  #widget div.widget-photo-space {
    position: relative !important;
    aspect-ratio: 4 / 3 !important;
    width: 100% !important;
    display: block !important;
    overflow: hidden !important;
    /* li.widget-event is a column flexbox, so without this the photo box gets
       flex-shrunk below its aspect ratio whenever the card's text is tall. */
    flex: 0 0 auto !important;
  }
  #widget div.widget-photo-space span,
  #widget div.widget-photo-space a,
  #widget div.widget-photo-space picture {
    display: block !important;
  }
  /* Absolute-fill rather than height:100% down the wrapper chain. A chain of
     percentage heights resolving against an aspect-ratio box leaves the image
     with no definite height to paint into -- it lays out at the right size but
     renders blank. Anchoring to the box's padding edge sidesteps that. */
  /* .key is an absolutely-positioned sibling that comes BEFORE the photo in
     the DOM, so once the image is positioned too it paints over the date
     badge. Lift the badge back on top. */
  #widget .key { z-index: 2 !important; }
  #widget div.widget-photo-space img {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    display: block !important;
  }

  /* Four columns inside a sidebar page leaves each card ~150-210px wide, so
     pull in the 20px padding LiveWhale hard-codes or the copy has nowhere to
     wrap. */
  @media (max-width: 1000px) {
    #widget ul.harvard-widget { grid-gap: 14px !important; }
    #widget div.widget-content { padding: 14px !important; }
    #widget div.widget-content > div.title > h3 { margin-bottom: 8px !important; }
    #widget div.title > h3 > a { font-size: 16px !important; }
    #widget div.des,
    #widget div.time,
    #widget div.place > div,
    #widget div.place > div > a { font-size: 14px !important; }
    #widget div.time { margin-top: 12px !important; padding-top: 10px !important; }
    #widget .key { padding: 7px !important; }
    #widget .key .day { font-size: 17px !important; }
    #widget .key .month { font-size: 12px !important; }
    #widget .key .year { font-size: 11px !important; }
  }

  /* Below tablet width four columns stops being legible, so step down. */
  @media (max-width: 640px) {
    #widget ul.harvard-widget { grid-template-columns: repeat(2, 1fr) !important; }
  }
  @media (max-width: 420px) {
    #widget ul.harvard-widget { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>

<!-- ofa.fas.harvard.edu/ceramics — Featured Events — LiveWhale widget id 45 -->
<div id="widget">
  <div class="lwcw" data-options="id=45&format=html"></div>
</div>

<script type="text/javascript" id="lw_lwcw" src="https://events.college.harvard.edu/livewhale/theme/core/scripts/lwcw.js"></script>
<script src="widget-frame.js" data-widget-id="45"></script>

</body>
</html>
