<style type="text/css">
#mc_embed_signup{
  --f:museo-sans,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ink:#1E1E1E;  
  --crim:#A51C30;  
  --cta:#007A8A;   
  --cream:#FBF7EF; 
  font:400 1.125rem/1.5 var(--f);color:var(--ink);max-width:38rem}
#mc_embed_signup h2{font:700 clamp(1.4375rem,5vw,1.75rem)/1.25 var(--f);margin:0 0 .5rem}
#mc_embed_signup .indicates-required{font-size:1rem;opacity:.75;margin:0 0 1.5rem}
#mc_embed_signup .asterisk{font-weight:700}
#mc_embed_signup .mc-field-group{margin:0 0 1.5rem}
#mc_embed_signup .mc-field-group label{display:block;font-weight:700;margin:0 0 .375rem}
#mc_embed_signup .mc-field-group input{
  box-sizing:border-box;width:100%;font:inherit;color:var(--ink);background:var(--cream);
  border:1px solid var(--crim);border-radius:5px;padding:10px}
#mc_embed_signup .mc-field-group input:focus-visible{outline:2px solid var(--crim);outline-offset:2px}
#mc_embed_signup .button{
  font:400 1.125rem/1.5 var(--f);color:#fff;background:var(--cta);text-align:center;
  border:2px solid transparent;border-radius:5px;padding:16px 22px;
  width:100%;max-width:19rem;min-width:min(15rem,100%);
  cursor:pointer;-webkit-appearance:none;appearance:none}
#mc_embed_signup .button:hover{background:#fff;border-color:var(--cta);color:var(--ink)}
#mc_embed_signup .button:focus-visible{outline:1px solid var(--crim);outline-offset:5px}
#mc_embed_signup div.mce_inline_error{
  font-size:1rem!important;font-weight:700!important;color:var(--ink)!important;
  background:none!important;border-left:4px solid var(--crim)!important;
  padding:.375rem 0 .375rem .625rem!important;margin:.5rem 0 0!important}
#mc_embed_signup input.mce_inline_error{border:2px solid var(--crim)!important}
#mc_embed_signup .response{
  margin:1rem 0;padding:.875rem 1rem;border-radius:5px;
  background:var(--cream);border-left:4px solid var(--crim)}
#mc_embed_signup #mce-success-response{border-left-color:var(--cta)}
</style>
