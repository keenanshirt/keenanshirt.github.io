<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curator Feed Embed</title>
    <style>
        /* Styles derived from your Layout screenshot */
        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent;
            width: 100%;
        }

        .hwp-container {
            position: relative;
            box-sizing: border-box;
            display: block;
            clear: both;
            
            /* Precise dimensions from screenshot */
            width: 1312px;
            height: 1207.67px;
            min-height: 400px;
            max-width: 100%;
            padding-bottom: 25px;
            
            /* Flex properties from screenshot */
            flex-basis: 100%;
            flex-grow: 0;
            flex-shrink: 0;
            
            margin: 0 auto; /* Center on page */
        }

        .hwp-embed__inner {
            width: 100%;
            height: 100%;
        }

        /* Ensure the powered-by link doesn't break layout before script loads */
        .crt-logo {
            display: none; 
        }
    </style>
</head>
<body>

<div class="hwp-container">
  <div class="hwp-embed__inner">
    
    <div id="curator-feed-default-feed-layout">
        <a href="https://curator.io" target="_blank" class="crt-logo crt-tag">Powered by Curator.io</a>
    </div>

    <script type="text/javascript">
      (function() {
        var i, e, d = document, s = "script";
        i = d.createElement("script");
        i.async = 1;
        i.charset = "UTF-8";
        i.src = "https://cdn.curator.io/published/a239f79a-b4db-4286-802f-073385aca485.js";
        e = d.getElementsByTagName(s)[0];
        e.parentNode.insertBefore(i, e);
      })();
    </script>

  </div>
</div>

</body>
</html>
