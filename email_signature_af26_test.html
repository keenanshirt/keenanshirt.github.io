<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presidential Signature Generator</title>
    <style>
        body { font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #f4f4f4; padding: 20px; color: #333; }
        .card { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; margin-bottom: 10px; color: #ef3f37; } /* Harvard Crimson */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
        .field { display: flex; flex-direction: column; }
        label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #888; text-transform: uppercase; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        .section-head { grid-column: span 2; font-size: 14px; font-weight: bold; border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 10px; color: #444; }
        button { background: #ef3f37; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #821626; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; min-height: 20px; }
        .preview-area { margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px; }
        #sig-container { background: white; padding: 20px; display: inline-block; border: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="card">
    <h1>Signature Generator</h1>
    
    <div class="grid">
        <div class="section-head">Personal Details</div>
        <div class="field"><label>Name</label><input type="text" id="name" value="Jane Harvard" oninput="render()"></div>
        <div class="field"><label>Pronouns</label><input type="text" id="pronouns" value="she/her" oninput="render()"></div>
        <div class="field"><label>Job Title</label><input type="text" id="title" value="President" oninput="render()"></div>
        <div class="field"><label>Phone</label><input type="text" id="phone" value="617-495-0000" oninput="render()"></div>
        
        <div class="section-head">Organization & Event</div>
        <div class="field"><label>Organization Name</label><input type="text" id="org" value="Office for the Arts at Harvard" oninput="render()"></div>
        <div class="field"><label>Event Text</label><input type="text" id="event" value="#ArtsFest | April 30 - May 3, 2026" oninput="render()"></div>
        <div class="field"><label>Office Hours</label><input type="text" id="officeHours" value="Mon-Fri, 9am-5pm" oninput="render()"></div>
        
        <div class="section-head">Links & Social</div>
        <div class="field"><label>Website Label</label><input type="text" id="webLabel" value="ofa.fas.harvard.edu/arts" oninput="render()"></div>
        <div class="field"><label>Website URL</label><input type="text" id="webUrl" value="https://ofa.fas.harvard.edu/arts" oninput="render()"></div>
        <div class="field"><label>Instagram Handle</label><input type="text" id="insta" value="@harvard_arts" oninput="render()"></div>
        <div class="field"><label>Instagram URL</label><input type="text" id="instaUrl" value="https://instagram.com/harvard_arts" oninput="render()"></div>
    </div>

    <button onclick="copySignature()">Copy for Outlook (Embedded Image)</button>
    <div id="status"></div>

    <div class="preview-area">
        <div id="sig-container"></div>
    </div>
</div>

    function render() {
        const val = (id) => document.getElementById(id).value.trim();
        
        // UNIFORM SPACING CONSTANTS
        const lineH = "18px";
        const fontF = "Arial, sans-serif";
        const baseStyle = `margin: 0; padding: 0; font-size: 14px; line-height: ${lineH}; color: #000000; font-family: ${fontF};`;
        const nameStyle = `margin: 0; padding: 0; font-size: 18px; line-height: ${lineH}; color: #ef3f37; font-weight: bold; font-family: ${fontF};`;
        const redStyle  = `margin: 0; padding: 0; font-size: 14px; line-height: ${lineH}; color: #ef3f37; font-weight: bold; font-family: ${fontF};`;
        const italicStyle = baseStyle + " font-style: italic;";

        const html = `
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; width: 500px;">
    <tr>
        <td valign="middle" width="150" style="padding-right: 20px; vertical-align: middle;">
            <img src="${LOGO_BASE64}" width="150" style="display: block; border: 0; width: 150px;">
        </td>
        <td width="1" style="border-left: 1px solid #000000; font-size: 0; line-height: 0;">&nbsp;</td>
        <td valign="middle" style="padding-left: 20px; vertical-align: middle;">
            <p style="${nameStyle}">${val('name')}</p>
            ${val('pronouns') ? `<p style="${italicStyle}">${val('pronouns')}</p>` : ''}
            <p style="${baseStyle}">${val('title')}</p>
            <p style="${italicStyle}">${val('org')}</p>
            <p style="${baseStyle}">${val('phone')}</p>
            <p style="${redStyle}">${val('event')}</p>
            <p style="${baseStyle}">${val('officeHours')}</p>
            <p style="${baseStyle}"><a href="${val('webUrl')}" style="color: #0000EE; text-decoration: underline;">${val('webLabel')}</a></p>
            <p style="${baseStyle}">Instagram: <a href="${val('instaUrl')}" style="color: #0000EE; text-decoration: underline;">${val('insta')}</a></p>
        </td>
    </tr>
</table>`;
        
        document.getElementById('sig-container').innerHTML = html;
        return html;
    }

    async function copySignature() {
        const status = document.getElementById('status');
        status.innerText = "Copying...";

        try {
            const html = render();
            const imgRes = await fetch(LOGO_BASE64);
            const imgBlob = await imgRes.blob();

            const data = [new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([document.getElementById('name').value], { type: "text/plain" }),
                "image/png": imgBlob 
            })];

            await navigator.clipboard.write(data);
            status.style.color = "green";
            status.innerText = "✅ Success! Paste into Outlook.";
        } catch (err) {
            status.style.color = "red";
            status.innerText = "❌ Error: Standalone page required (SharePoint/Sites blocked).";
        }
    }

    render();
</script>

</body>
</html>
